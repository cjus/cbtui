# cargo-deny configuration: run `cargo deny check` (CI runs it on every PR).
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
# Known security vulnerabilities and unmaintained crates fail the check.
ignore = []

[licenses]
# cbtui is `MIT OR Apache-2.0`, so every dependency must have a permissive licence (or
# MPL-2.0, which covers only its own files). No GPL: cbtui links no GPL code. (An engine it
# starts is a separate program, whatever its licence.)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The Chess Node Protocol's crate and cb2026's rules crate, pinned by commit in Cargo.toml.
allow-git = [
    "https://github.com/cjus/chess-node-protocol",
    "https://github.com/cjus/chessengine",
]
