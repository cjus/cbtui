# Builds the downloads when a version tag (v0.1.0, ...) is pushed and attaches them to a draft
# GitHub release, which Carlos reviews and publishes. See docs/releasing.md.
#
# Each download is cbtui and the cb2026 engine it plays, built at the chessengine commit
# Cargo.toml pins and without Syzygy tablebases (so it's MIT OR Apache-2.0 like cbtui), with
# the licences and the third-party notices. The macOS binaries are signed and notarised
# afterwards, on Carlos's Mac, where the Developer ID key is: scripts/mac-sign-release.sh
# replaces them on the draft (docs/releasing.md).
#
# A pull request that changes this workflow or the notices builds every download too, without
# releasing, so a broken build shows before a tag does. So does running it by hand
# (`gh workflow run release.yml`).
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release-notes.md
      - scripts/notices.sh
      - scripts/notices/**
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The chessengine commit to bundle: the one Cargo.toml pins for the rules crate, so the engine
  # and the rules always match.
  pin:
    runs-on: ubuntu-latest
    outputs:
      rev: ${{ steps.rev.outputs.rev }}
    steps:
      - uses: actions/checkout@v4
      - id: rev
        run: echo "rev=$(grep -o 'chessengine", rev = "[0-9a-f]*' Cargo.toml | grep -o '[0-9a-f]\{40\}')" >> "$GITHUB_OUTPUT"

  # The third-party notices (scripts/notices.sh), made once on Linux and put in every download:
  # they cover every platform's crates.
  notices:
    needs: pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cjus/chessengine
          ref: ${{ needs.pin.outputs.rev }}
          path: chessengine
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Third-party notices
        run: scripts/notices.sh chessengine
      - uses: actions/upload-artifact@v4
        with:
          name: notices
          path: target/licences/THIRD-PARTY-NOTICES.txt

  build:
    name: build (${{ matrix.target }})
    needs: [pin, notices]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on the oldest runner there is, so the binaries need no newer glibc than it has.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel Macs: cross-compiled on the Apple Silicon runner.
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cjus/chessengine
          ref: ${{ needs.pin.outputs.rev }}
          path: chessengine
      - name: Install the toolchains from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          cd chessengine
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Build cbtui
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build cb2026, without Syzygy tablebases
        working-directory: chessengine
        run: cargo build --release --locked -p cb2026 --no-default-features --target ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: notices
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || version="dev-${GITHUB_SHA::7}"
          name="cbtui-${version}-${{ matrix.target }}"
          exe=""
          [[ "${{ matrix.target }}" == *windows* ]] && exe=".exe"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/cbtui$exe" "$name/"
          cp "chessengine/target/${{ matrix.target }}/release/cb2026$exe" "$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt "$name/"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "EXE=$exe" >> "$GITHUB_ENV"
      - name: Try them
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          "$NAME/cbtui$EXE" --version
          "$NAME/cb2026$EXE" --version
      - name: Archive
        shell: bash
        run: |
          if [[ -n "$EXE" ]]; then
            7z a "$NAME.zip" "$NAME" > /dev/null
            echo "ASSET=$NAME.zip" >> "$GITHUB_ENV"
          else
            tar czf "$NAME.tar.gz" "$NAME"
            echo "ASSET=$NAME.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: "*-*-*"
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: assets/*
