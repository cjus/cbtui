# Builds the downloads when a version tag (v0.1.0, ...) is pushed and attaches them to a draft
# GitHub release, which Carlos reviews and publishes. See docs/releasing.md.
#
# Each download is cbtui and the cb2026 engine it plays, built at the chessengine commit
# Cargo.toml pins and without Syzygy tablebases (so it's MIT OR Apache-2.0 like cbtui), with
# the licences and the third-party notices. macOS binaries are signed and notarised when the
# Apple secrets are set (docs/releasing.md says which), and left unsigned, with a warning,
# when they aren't.
#
# A pull request that changes this workflow or the notices builds every download too, without
# signing or releasing, so a broken build shows before a tag does. So does running it by hand
# (`gh workflow run release.yml`), which also signs if it can.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release-notes.md
      - scripts/notices.sh
      - scripts/notices/**
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The chessengine commit to bundle: the one Cargo.toml pins for the rules crate, so the engine
  # and the rules always match.
  pin:
    runs-on: ubuntu-latest
    outputs:
      rev: ${{ steps.rev.outputs.rev }}
    steps:
      - uses: actions/checkout@v4
      - id: rev
        run: echo "rev=$(grep -o 'chessengine", rev = "[0-9a-f]*' Cargo.toml | grep -o '[0-9a-f]\{40\}')" >> "$GITHUB_OUTPUT"

  # The third-party notices (scripts/notices.sh), made once on Linux and put in every download:
  # they cover every platform's crates.
  notices:
    needs: pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cjus/chessengine
          ref: ${{ needs.pin.outputs.rev }}
          path: chessengine
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Third-party notices
        run: scripts/notices.sh chessengine
      - uses: actions/upload-artifact@v4
        with:
          name: notices
          path: target/licences/THIRD-PARTY-NOTICES.txt

  build:
    name: build (${{ matrix.target }})
    needs: [pin, notices]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on the oldest runner there is, so the binaries need no newer glibc than it has.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel Macs: cross-compiled on the Apple Silicon runner.
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cjus/chessengine
          ref: ${{ needs.pin.outputs.rev }}
          path: chessengine
      - name: Install the toolchains from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          cd chessengine
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Build cbtui
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build cb2026, without Syzygy tablebases
        working-directory: chessengine
        run: cargo build --release --locked -p cb2026 --no-default-features --target ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: notices
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || version="dev-${GITHUB_SHA::7}"
          name="cbtui-${version}-${{ matrix.target }}"
          exe=""
          [[ "${{ matrix.target }}" == *windows* ]] && exe=".exe"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/cbtui$exe" "$name/"
          cp "chessengine/target/${{ matrix.target }}/release/cb2026$exe" "$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt "$name/"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "EXE=$exe" >> "$GITHUB_ENV"
      - name: Try them
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          "$NAME/cbtui$EXE" --version
          "$NAME/cb2026$EXE" --version
      # Developer ID signing and notarisation, for tags and runs by hand, when the secrets are
      # there. A command-line binary can't have its ticket stapled, so Gatekeeper fetches it the
      # first time the binary runs.
      - name: Sign and notarise (macOS)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "::warning::No Apple signing secrets: the macOS binaries are unsigned (docs/releasing.md)."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          for binary in cbtui cb2026; do
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$NAME/$binary"
            codesign --verify --strict --verbose=2 "$NAME/$binary"
          done
          ditto -c -k --keepParent "$NAME" notarise.zip
          xcrun notarytool submit notarise.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --output-format json | tee notarised.json
          status=$(python3 -c 'import json; print(json.load(open("notarised.json"))["status"])')
          if [[ "$status" != "Accepted" ]]; then
            id=$(python3 -c 'import json; print(json.load(open("notarised.json"))["id"])')
            xcrun notarytool log "$id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD"
            echo "::error::Notarisation was $status."
            exit 1
          fi
          rm notarise.zip notarised.json
      - name: Archive
        shell: bash
        run: |
          if [[ -n "$EXE" ]]; then
            7z a "$NAME.zip" "$NAME" > /dev/null
            echo "ASSET=$NAME.zip" >> "$GITHUB_ENV"
          else
            tar czf "$NAME.tar.gz" "$NAME"
            echo "ASSET=$NAME.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: "*-*-*"
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: assets/*
